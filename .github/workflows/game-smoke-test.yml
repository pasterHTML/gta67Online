name: Game smoke tests

on:
  push:
    branches: [main]
    paths:
      - "gta67.html"
      - "server.js"
      - "src/**"
      - "scripts/**"
      - "assets/cars/**"
      - "package.json"
      - ".github/workflows/game-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib

          html = pathlib.Path("gta67.html").read_text(encoding="utf-8")
          opening_tag = '<script type="module">'
          start = html.find(opening_tag)
          if start < 0:
              raise SystemExit("The module script was not found in gta67.html")
          body_start = start + len(opening_tag)
          end = html.find("</script>", body_start)
          if end < 0:
              raise SystemExit("The closing module script tag was not found")
          pathlib.Path("/tmp/gta67-game.mjs").write_text(html[body_start:end], encoding="utf-8")
          pathlib.Path("/tmp/vehicle-assets.mjs").write_text(
              pathlib.Path("src/vehicle-assets.js").read_text(encoding="utf-8"),
              encoding="utf-8"
          )
          PY
          node --check /tmp/gta67-game.mjs
          node --check /tmp/vehicle-assets.mjs
          node --check server.js
          node --check scripts/optimize-vehicle-models.mjs

      - name: Verify optimized vehicle manifest
        run: |
          python3 <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("assets/cars/manifest.json").read_text(encoding="utf-8"))
          if len(manifest.get("vehicles", [])) != 5:
              raise SystemExit("Expected exactly five vehicle models")
          for vehicle in manifest["vehicles"]:
              for field in ("optimizedModel", "farOptimizedModel"):
                  model_path = vehicle.get(field)
                  if not model_path or not pathlib.Path(model_path).is_file():
                      raise SystemExit("Missing " + field + " for " + vehicle.get("name", "vehicle"))
          print("Five near and five far GLB vehicle models are present.")
          PY

      - name: Install server dependency
        run: npm install --no-audit --no-fund

      - name: Smoke test game and GLTF asset routes
        shell: bash
        run: |
          set -euo pipefail
          node server.js >/tmp/leonida-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/gta67.html -o /tmp/gta67.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/gta67.html
          curl -fsS http://127.0.0.1:3000/src/vehicle-assets.js -o /tmp/vehicle-assets.js
          curl -fsS http://127.0.0.1:3000/assets/cars/manifest.json -o /tmp/vehicle-manifest.json
          curl -fsS http://127.0.0.1:3000/assets/cars/mclaren-650s-gt3/scene-optimized.glb -o /tmp/mclaren-near.glb
          curl -fsS http://127.0.0.1:3000/assets/cars/mclaren-650s-gt3/scene-lod.glb -o /tmp/mclaren-far.glb
          test -s /tmp/vehicle-assets.js
          test -s /tmp/vehicle-manifest.json
          test -s /tmp/mclaren-near.glb
          test -s /tmp/mclaren-far.glb
          echo "Game HTML, module, manifest, near GLB and far LOD GLB routes are available."
