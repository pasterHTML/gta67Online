name: Optimize vehicle models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/optimize-vehicle-models.mjs"

permissions:
  contents: write

concurrency:
  group: optimize-vehicle-models
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install glTF optimization tools
        run: npm install --no-save --no-audit --no-fund @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer sharp

      - name: Regenerate and publish optimized near/far vehicle models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "Optimization publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            node scripts/optimize-vehicle-models.mjs
            git add assets/cars/manifest.json assets/cars/*/scene-optimized.glb assets/cars/*/scene-lod.glb

            if git diff --cached --quiet; then
              echo "Optimized model assets are already up to date."
              exit 0
            fi

            git commit -m "Add optimized near and far vehicle LOD models"
            if git push origin HEAD:main; then
              echo "Optimized vehicle assets published."
              exit 0
            fi

            echo "A concurrent update reached main. Retrying from the latest main."
            sleep 2
          done

          echo "Could not publish optimized vehicle assets after retries."
          exit 1
