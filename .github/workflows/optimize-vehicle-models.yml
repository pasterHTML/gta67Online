name: Optimize vehicle models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/optimize-vehicle-models.mjs"
      - "assets/cars/*/scene.gltf"
      - ".github/workflows/optimize-vehicle-models.yml"

permissions:
  contents: write

concurrency:
  group: optimize-vehicle-models
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install glTF optimization tools
        run: npm install --no-save --no-audit --no-fund @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 @gltf-transform/functions@4.5.1 meshoptimizer sharp

      - name: Reduce vehicle polygons and texture memory
        run: node scripts/optimize-vehicle-models.mjs

      - name: Commit optimized GLB assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cars/manifest.json assets/cars/*/scene-optimized.glb
          if git diff --cached --quiet; then
            echo "No optimized vehicle assets were produced."
            exit 1
          fi
          git commit -m "Add optimized GLB vehicle models with geometry stats"
          git push
